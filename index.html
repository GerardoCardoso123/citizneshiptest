<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>U.S. Citizenship Practice Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

header {
    background: #123c69;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-top: 8px;
    opacity: 0.9;
}

.container {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.progress {
    font-weight: bold;
    color: #555;
    margin-bottom: 15px;
}

.question {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 16px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    background: white;
    text-align: left;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #f3f4f6;
}

.answer.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
}

.answer.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #991b1b;
}

.feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    font-weight: bold;
}

.feedback.correct {
    background: #dcfce7;
    color: #166534;
}

.feedback.wrong {
    background: #fee2e2;
    color: #991b1b;
}

.next-btn,
.restart-btn {
    margin-top: 20px;
    padding: 14px 25px;
    border: none;
    border-radius: 8px;
    background: #123c69;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.next-btn:hover,
.restart-btn:hover {
    background: #0b2948;
}

.score {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
}

.result-message {
    text-align: center;
    font-size: 20px;
    margin-bottom: 25px;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<header>

<h1>🇺🇸 U.S. Citizenship Practice Test</h1>

<p>20 random questions from the 128-question civics pool</p>

</header>


<div class="container">

<div class="card" id="quizCard">

<div class="progress" id="progress">
Question 1 of 20
</div>

<div class="question" id="question">
Loading...
</div>

<div class="answers" id="answers">
</div>

<div class="feedback" id="feedback"></div>

<button class="next-btn hidden" id="nextButton">
Next Question
</button>

</div>


<div class="card hidden" id="resultCard">

<div class="score" id="finalScore">
</div>

<div class="result-message" id="resultMessage">
</div>

<button class="restart-btn" onclick="startQuiz()">
Take Another Test
</button>

</div>

</div>


<script>

/*
==================================================
QUESTION POOL
==================================================

Each question has:

question = question text

correct = correct answer

wrong = three incorrect answers

*/

const questionPool = [

{
    question: "What is the supreme law of the land?",
    correct: "The U.S. Constitution",
    wrong: [
        "The Declaration of Independence",
        "The Bill of Rights",
        "The Articles of Confederation"
    ]
},

{
    question: "What does the Constitution do?",
    correct: "Defines the government",
    wrong: [
        "Declares independence from Britain",
        "Creates political parties",
        "Elects the president"
    ]
},

{
    question: "The idea of self-government is in the first three words of the Constitution. What are these words?",
    correct: "We the People",
    wrong: [
        "United States Constitution",
        "Life, Liberty, Happiness",
        "Four Score Seven"
    ]
},

{
    question: "What are the three branches of government?",
    correct: "Legislative, executive, and judicial",
    wrong: [
        "Federal, state, and local",
        "President, Senate, and House",
        "Army, Navy, and Air Force"
    ]
},

{
    question: "What is the highest court in the United States?",
    correct: "The Supreme Court",
    wrong: [
        "The Federal Court",
        "The Court of Appeals",
        "The Constitutional Court"
    ]
},

{
    question: "How many U.S. senators are there?",
    correct: "100",
    wrong: [
        "50",
        "435",
        "200"
    ]
},

{
    question: "How long is a term for a U.S. senator?",
    correct: "Six years",
    wrong: [
        "Two years",
        "Four years",
        "Eight years"
    ]
},

{
    question: "How many voting members are in the House of Representatives?",
    correct: "435",
    wrong: [
        "100",
        "50",
        "538"
    ]
},

{
    question: "How long is a term for a member of the House of Representatives?",
    correct: "Two years",
    wrong: [
        "Four years",
        "Six years",
        "Eight years"
    ]
},

{
    question: "How many senators does each state have?",
    correct: "Two",
    wrong: [
        "One",
        "Four",
        "Ten"
    ]
},

{
    question: "Who makes federal laws?",
    correct: "Congress",
    wrong: [
        "The President alone",
        "The Supreme Court",
        "State governors"
    ]
},

{
    question: "What are the two parts of the U.S. Congress?",
    correct: "The Senate and House of Representatives",
    wrong: [
        "The President and Senate",
        "The Supreme Court and Senate",
        "The House and Supreme Court"
    ]
},

{
    question: "Who is the Commander in Chief of the military?",
    correct: "The President",
    wrong: [
        "The Secretary of State",
        "The Speaker of the House",
        "The Chief Justice"
    ]
},

{
    question: "What is one power of the federal government?",
    correct: "To declare war",
    wrong: [
        "To establish local school districts",
        "To issue driver's licenses",
        "To choose state governors"
    ]
},

{
    question: "What is one right from the First Amendment?",
    correct: "Freedom of speech",
    wrong: [
        "The right to drive",
        "The right to free college",
        "The right to own a business"
    ]
},

{
    question: "What is the economic system in the United States?",
    correct: "A capitalist economy",
    wrong: [
        "A communist economy",
        "A monarchy",
        "A feudal economy"
    ]
},

{
    question: "What is the rule of law?",
    correct: "Everyone must follow the law",
    wrong: [
        "Only citizens must follow laws",
        "The president is above the law",
        "Judges make all laws"
    ]
},

{
    question: "Why is the Declaration of Independence important?",
    correct: "It declared our independence from Great Britain",
    wrong: [
        "It created the Supreme Court",
        "It established the Senate",
        "It ended the Civil War"
    ]
},

{
    question: "Who wrote the Declaration of Independence?",
    correct: "Thomas Jefferson",
    wrong: [
        "George Washington",
        "Abraham Lincoln",
        "Benjamin Franklin"
    ]
},

{
    question: "When was the Declaration of Independence adopted?",
    correct: "July 4, 1776",
    wrong: [
        "July 4, 1787",
        "September 17, 1787",
        "December 25, 1776"
    ]
},

{
    question: "Who was the first President of the United States?",
    correct: "George Washington",
    wrong: [
        "Thomas Jefferson",
        "John Adams",
        "Abraham Lincoln"
    ]
},

{
    question: "What territory did the United States buy from France in 1803?",
    correct: "The Louisiana Territory",
    wrong: [
        "Florida",
        "Alaska",
        "Texas"
    ]
},

{
    question: "What war did the United States fight to become independent from Britain?",
    correct: "The American Revolution",
    wrong: [
        "The Civil War",
        "The War of 1812",
        "World War I"
    ]
},

{
    question: "What was one important thing that Abraham Lincoln did?",
    correct: "Freed the slaves",
    wrong: [
        "Wrote the Constitution",
        "Purchased Louisiana",
        "Became the first president"
    ]
}

];


/*
==================================================
QUIZ VARIABLES
==================================================
*/

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;


/*
==================================================
START QUIZ
==================================================
*/

function startQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;

    /*
    Shuffle the entire question pool
    and select 20 questions.
    */

    quizQuestions = [...questionPool]
        .sort(() => Math.random() - 0.5)
        .slice(0, 20);

    document
        .getElementById("quizCard")
        .classList.remove("hidden");

    document
        .getElementById("resultCard")
        .classList.add("hidden");

    showQuestion();
}


/*
==================================================
SHOW QUESTION
==================================================
*/

function showQuestion() {

    answered = false;

    const question = quizQuestions[currentQuestion];

    document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} of ${quizQuestions.length}`;

    document.getElementById("question").textContent =
        question.question;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    document.getElementById("feedback").style.display = "none";

    document
        .getElementById("nextButton")
        .classList.add("hidden");


    /*
    Combine correct + wrong answers
    */

    let choices = [
        question.correct,
        ...question.wrong
    ];


    /*
    Randomize answer choices
    */

    choices = choices.sort(() => Math.random() - 0.5);


    /*
    Create buttons
    */

    choices.forEach(choice => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = choice;

        button.onclick = () => selectAnswer(button, choice);

        answersContainer.appendChild(button);

    });

}


/*
==================================================
SELECT ANSWER
==================================================
*/

function selectAnswer(button, selectedAnswer) {

    if (answered) return;

    answered = true;

    const question = quizQuestions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".answer");


    /*
    Disable all answers
    */

    allButtons.forEach(btn => {
        btn.disabled = true;
    });


    /*
    Check answer
    */

    if (selectedAnswer === question.correct) {

        button.classList.add("correct");

        score++;

        showFeedback(
            true,
            "Correct! ✓"
        );

    } else {

        button.classList.add("wrong");

        /*
        Find the correct answer button
        */

        allButtons.forEach(btn => {

            if (btn.textContent === question.correct) {

                btn.classList.add("correct");

            }

        });


        showFeedback(
            false,
            `Incorrect. The correct answer is: ${question.correct}`
        );

    }


    /*
    Show next button
    */

    document
        .getElementById("nextButton")
        .classList.remove("hidden");

}


/*
==================================================
FEEDBACK
==================================================
*/

function showFeedback(correct, message) {

    const feedback =
        document.getElementById("feedback");

    feedback.textContent = message;

    feedback.style.display = "block";

    feedback.className =
        "feedback " + (correct ? "correct" : "wrong");

}


/*
==================================================
NEXT QUESTION
==================================================
*/

document
    .getElementById("nextButton")
    .addEventListener("click", () => {

        currentQuestion++;

        if (currentQuestion < quizQuestions.length) {

            showQuestion();

        } else {

            showResults();

        }

    });


/*
==================================================
SHOW RESULTS
==================================================
*/

function showResults() {

    document
        .getElementById("quizCard")
        .classList.add("hidden");

    document
        .getElementById("resultCard")
        .classList.remove("hidden");

    document
        .getElementById("finalScore")
        .textContent =
        `${score} / ${quizQuestions.length}`;

    let message = "";

    if (score >= 12) {

        message =
            "You reached the 12/20 passing threshold for the 2025 civics test.";

    } else {

        message =
            "You scored below the 12/20 passing threshold. Keep practicing!";

    }

    document
        .getElementById("resultMessage")
        .textContent = message;

}


/*
==================================================
START
==================================================
*/

startQuiz();

</script>

</body>
</html>
